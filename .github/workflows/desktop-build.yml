name: Build Open Workflow desktop

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_ARTIFACTS: test-results/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-workflow-browser-${{ github.run_id }}
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 14
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Verify native file operations and compile the shell
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --lib
      - name: Package desktop application
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installers and checksums
        env:
          WORKFLOW_TARGET: ${{ matrix.target }}
          WORKFLOW_PLATFORM: ${{ matrix.platform }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync, mkdirSync, copyFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { join, basename } from 'node:path';
          import { createHash } from 'node:crypto';
          const root = `src-tauri/target/${process.env.WORKFLOW_TARGET}/release/bundle`;
          const collect = (dir) => readdirSync(dir).flatMap(name => {
            const file = join(dir, name);
            return statSync(file).isDirectory() ? collect(file) : /\.(exe|dmg)$/.test(name) ? [file] : [];
          });
          const files = collect(root);
          if (!files.length) throw new Error('No installer was produced');
          mkdirSync('desktop-artifacts', { recursive: true });
          const checksums = files.map(file => {
            if (!statSync(file).size) throw new Error(`Empty installer: ${file}`);
            copyFileSync(file, join('desktop-artifacts', basename(file)));
            return `${createHash('sha256').update(readFileSync(file)).digest('hex')}  ${basename(file)}`;
          });
          writeFileSync('desktop-artifacts/SHA256SUMS', checksums.join('\n') + '\n');
          writeFileSync('desktop-artifacts/build.json', JSON.stringify({ commit: process.env.WORKFLOW_SHA, platform: process.env.WORKFLOW_PLATFORM, version: JSON.parse(readFileSync('package.json', 'utf8')).version }, null, 2) + '\n');
          copyFileSync('LICENSE', 'desktop-artifacts/LICENSE');
          copyFileSync('THIRD_PARTY_NOTICES.md', 'desktop-artifacts/THIRD_PARTY_NOTICES.md');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: open-workflow-${{ matrix.platform }}-${{ github.run_id }}
          path: desktop-artifacts/
          if-no-files-found: error
          retention-days: 14
