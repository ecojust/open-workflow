[package]
name = "open-workflow"
version = "0.3.1"
description = "Local workflow diagrams and an infinite whiteboard"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "open_workflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-workflow"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [], optional = true }

[dependencies]
tauri = { version = "=2.12.3", features = [], optional = true }
tauri-plugin-dialog = { version = "=2.8.2", optional = true }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
getrandom = "0.3"
if-addrs = "0.13"
time = { version = "0.3", features = ["parsing"] }
